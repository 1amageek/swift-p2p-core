name: Retirement Contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retirement-contract:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify empty package graph
        run: |
          set -euo pipefail
          manifest="$(swift package dump-package)"
          jq -e '
            (.products | length) == 0 and
            (.targets | length) == 0 and
            (.dependencies | length) == 0
          ' <<< "$manifest"
